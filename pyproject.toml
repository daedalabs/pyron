[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyron-engine"
version = "0.1.0"
description = "Headless provenance-first academic study guide compiler engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Deogenes Maranan", email = "contact@daedalabs.org" }
]
keywords = ["academic", "compiler", "study-guide", "transcription", "provenance", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "pydantic>=2.4.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# PyMuPDF is AGPL-3.0. It remains strictly optional so the core package
# can be distributed without pulling an AGPL dependency into standard builds.
pdf = ["pymupdf>=1.24.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
pyron = "pyron.cli:main"

[project.urls]
Homepage = "https://github.com/daedalabs/pyron"
Repository = "https://github.com/daedalabs/pyron"
Documentation = "https://github.com/daedalabs/pyron#readme"

[tool.setuptools.packages.find]
include = ["pyron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
